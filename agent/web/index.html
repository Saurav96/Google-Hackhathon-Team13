<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Market relief desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <h1>Central Market relief desk</h1>
      <p>Who to fund, and what each grant protects</p>
    </div>
    <div class="budget" id="budget" aria-live="polite"></div>
    <nav class="mode" aria-label="Situation">
      <button type="button" data-mode="queue" class="is-on">Applicants in the queue</button>
      <button type="button" data-mode="employer">A large employer leaves</button>
    </nav>
  </header>

  <main class="desk">
    <aside class="side" id="side" aria-label="Applicants and employers"></aside>

    <section class="stage" aria-label="Corridor map">
      <div class="stage-head">
        <p class="stage-line" id="stage-line">Choose a business to see what its closure would expose.</p>
        <label class="find">
          <span>Find any business</span>
          <input type="search" id="find" list="find-list" placeholder="Type a name" autocomplete="off">
          <datalist id="find-list"></datalist>
        </label>
      </div>
      <div class="map-wrap">
        <svg id="map" viewBox="0 0 1000 560" role="img" aria-label="Map of businesses in the Central Market corridor"></svg>
        <div class="tip" id="tip" hidden></div>
        <ul class="legend" id="legend"></ul>
      </div>
    </section>

    <section class="case" aria-label="Case file">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="case" class="is-on">Case</button>
        <button type="button" role="tab" data-tab="memo">Grant memo</button>
        <button type="button" role="tab" data-tab="evidence">Evidence</button>
      </div>
      <div class="pane" id="pane-case"></div>
      <div class="pane" id="pane-memo" hidden></div>
      <div class="pane" id="pane-evidence" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
